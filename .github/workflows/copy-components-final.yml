name: Final copy original components

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/copy-components-final.yml"

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4

      - name: Clone original
        run: git clone --depth 1 https://github.com/zozototo104-pixel/masroufi-ai.git /tmp/original

      - name: Copy original components
        run: |
          rm -rf src/components
          mkdir -p src/components
          cp -a /tmp/original/src/components/. src/components/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components
          git diff --cached --quiet && exit 0 || git commit -m "Copy original src/components exactly"
          git push
