name: Fast copy project root files

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fast-copy-root-files.yml"

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
      - name: Clone source
        run: git clone --depth 1 https://github.com/zozototo104-pixel/masroufi-ai.git /tmp/masroufi-source
      - name: Copy root files
        run: |
          find /tmp/masroufi-source -maxdepth 1 -type f -exec cp -a {} ./ \;
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0 || git commit -m "Copy project root files from masroufi-ai"
          git push
