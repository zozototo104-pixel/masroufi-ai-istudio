name: Final exact mirror cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-reconcile.yml"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4

      - name: Clone original
        run: git clone --depth 1 https://github.com/zozototo104-pixel/masroufi-ai.git /tmp/original

      - name: Make target working tree exactly match original
        run: |
          rsync -a --delete --exclude='.git/' /tmp/original/ ./

      - name: Commit exact mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0 || git commit -m "Exact mirror from masroufi-ai [skip ci]"
          git push
