name: Fast bulk copy src/lib

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fast-copy-src-lib.yml"

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4

      - name: Clone source
        run: git clone --depth 1 https://github.com/zozototo104-pixel/masroufi-ai.git /tmp/masroufi-source

      - name: Copy all files inside src/lib
        run: |
          rm -rf src/lib
          mkdir -p src/lib
          cp -a /tmp/masroufi-source/src/lib/. src/lib/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib
          git diff --cached --quiet && exit 0 || git commit -m "Bulk copy all src/lib files from masroufi-ai"
          git push
