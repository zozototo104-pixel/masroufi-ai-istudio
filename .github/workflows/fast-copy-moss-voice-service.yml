name: Fast bulk copy moss-voice-service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fast-copy-moss-voice-service.yml"

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4

      - name: Clone source
        run: git clone --depth 1 https://github.com/zozototo104-pixel/masroufi-ai.git /tmp/masroufi-source

      - name: Copy moss-voice-service
        run: |
          test -d /tmp/masroufi-source/moss-voice-service
          rm -rf moss-voice-service
          mkdir -p moss-voice-service
          cp -a /tmp/masroufi-source/moss-voice-service/. moss-voice-service/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moss-voice-service
          git diff --cached --quiet && exit 0 || git commit -m "Bulk copy moss-voice-service from masroufi-ai"
          git push
