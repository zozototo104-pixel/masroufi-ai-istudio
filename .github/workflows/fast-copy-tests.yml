name: Fast bulk copy tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fast-copy-tests.yml"

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4

      - name: Clone source
        run: git clone --depth 1 https://github.com/zozototo104-pixel/masroufi-ai.git /tmp/masroufi-source

      - name: Copy tests
        run: |
          test -d /tmp/masroufi-source/tests
          rm -rf tests
          mkdir -p tests
          cp -a /tmp/masroufi-source/tests/. tests/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git diff --cached --quiet && exit 0 || git commit -m "Bulk copy tests from masroufi-ai"
          git push
