name: Fast bulk copy src/server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fast-copy-components-server.yml"

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4

      - name: Clone source
        run: git clone --depth 1 https://github.com/zozototo104-pixel/masroufi-ai.git /tmp/masroufi-source

      - name: Copy src/server
        run: |
          test -d /tmp/masroufi-source/src/server
          rm -rf src/server
          mkdir -p src/server
          cp -a /tmp/masroufi-source/src/server/. src/server/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server
          git diff --cached --quiet && exit 0 || git commit -m "Bulk copy src/server from masroufi-ai"
          git push
