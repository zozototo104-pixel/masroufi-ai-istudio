name: Fast bulk copy public

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fast-copy-public.yml"

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4

      - name: Clone source
        run: git clone --depth 1 https://github.com/zozototo104-pixel/masroufi-ai.git /tmp/masroufi-source

      - name: Copy public and record source folders
        run: |
          test -d /tmp/masroufi-source/public
          rm -rf public
          mkdir -p public .copy-manifests
          cp -a /tmp/masroufi-source/public/. public/
          find /tmp/masroufi-source -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -v '^\.git | sort > .copy-manifests/top-level-dirs.txt
          find /tmp/masroufi-source/public -type f -printf '%P\n' | sort > .copy-manifests/public-files.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public .copy-manifests
          git diff --cached --quiet && exit 0 || git commit -m "Bulk copy public and record source folders"
          git push
