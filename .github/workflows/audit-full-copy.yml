name: Audit full repository copy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-full-copy.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source
        run: git clone --depth 1 https://github.com/zozototo104-pixel/masroufi-ai.git /tmp/masroufi-source

      - name: Compare tracked files and blob SHAs
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          source = Path('/tmp/masroufi-source')
          target = Path('.')
          out = Path('.copy-audit')
          out.mkdir(exist_ok=True)

          def git_files(root):
              p = subprocess.run(['git', '-C', str(root), 'ls-files', '-z'], capture_output=True, check=True)
              return sorted(x.decode() for x in p.stdout.split(b'\0') if x)

          def blob_sha(root, path):
              p = subprocess.run(['git', '-C', str(root), 'hash-object', path], capture_output=True, text=True, check=True)
              return p.stdout.strip()

          sf = git_files(source)
          tf = git_files(target)
          ss, ts = set(sf), set(tf)
          missing = sorted(ss - ts)
          extra = sorted(ts - ss)
          common = sorted(ss & ts)
          changed = [p for p in common if blob_sha(source, p) != blob_sha(target, p)]

          source_head = subprocess.run(['git','-C',str(source),'rev-parse','HEAD'], capture_output=True,text=True,check=True).stdout.strip()
          target_head = subprocess.run(['git','rev-parse','HEAD'], capture_output=True,text=True,check=True).stdout.strip()

          report = [
              f'SOURCE_HEAD={source_head}',
              f'TARGET_HEAD={target_head}',
              f'SOURCE_FILE_COUNT={len(sf)}',
              f'TARGET_FILE_COUNT={len(tf)}',
              f'MISSING_COUNT={len(missing)}',
              f'CHANGED_COUNT={len(changed)}',
              f'EXTRA_COUNT={len(extra)}',
              '', '[MISSING]', *missing, '',
              '[CHANGED]', *changed, '',
              '[EXTRA]', *extra, ''
          ]
          (out/'full-compare.txt').write_text('\n'.join(report), encoding='utf-8')
          PY

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .copy-audit/full-compare.txt
          git diff --cached --quiet && exit 0 || git commit -m "Add full repository copy audit"
          git push
